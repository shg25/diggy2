<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" font-family="'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#98a5bd"/>
    </marker>
    <marker id="arrowLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e0603c"/>
    </marker>
  </defs>

  <rect width="1120" height="900" fill="#ffffff"/>

  <text x="510" y="50" text-anchor="middle" font-size="27" font-weight="bold" fill="#1a2340">生徒会駆動開発のフロー</text>
  <text x="510" y="76" text-anchor="middle" font-size="15" fill="#6b7a99">1機能 = 1回の会合 = 1議事録 = 1 Issue = 1ブランチ = 1 PR</text>

  <!-- 議案書 -->
  <rect x="150" y="98" width="720" height="46" rx="8" fill="#eef1f7" stroke="#c9d3e8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="510" y="127" text-anchor="middle" font-size="16" fill="#5b6a88">議案書（roadmap.md）— 新機能候補の一覧。ここから議題を選ぶ</text>
  <line x1="510" y1="144" x2="510" y2="168" stroke="#98a5bd" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 1 議題提出 -->
  <rect x="150" y="168" width="720" height="72" rx="10" fill="#f4f6fb" stroke="#c9d3e8" stroke-width="1.5"/>
  <circle cx="190" cy="204" r="17" fill="#5b6a88"/>
  <text x="190" y="210" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">1</text>
  <text x="226" y="198" font-size="19" font-weight="bold" fill="#1a2340">議題提出</text>
  <text x="226" y="222" font-size="14" fill="#6b7a99">GitHub Issue を立てる（背景・実現方針・完了条件を書く）</text>
  <line x1="510" y1="240" x2="510" y2="262" stroke="#98a5bd" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 質疑応答(人間) -->
  <rect x="150" y="262" width="720" height="72" rx="10" fill="#fff4ee" stroke="#e0603c" stroke-width="2.5"/>
  <circle cx="190" cy="298" r="17" fill="#e0603c"/>
  <text x="190" y="304" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">2</text>
  <text x="226" y="292" font-size="19" font-weight="bold" fill="#1a2340">質疑応答</text>
  <text x="226" y="316" font-size="14" fill="#8a6a5c">会長が口頭で答弁 → 書記（AI）が Issue コメントに清書</text>
  <rect x="726" y="278" width="128" height="26" rx="13" fill="#e0603c"/>
  <text x="790" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">会長（人間）</text>
  <line x1="510" y1="334" x2="510" y2="356" stroke="#98a5bd" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="528" y="350" font-size="13" fill="#6b7a99">承認</text>

  <!-- 3 分科会 -->
  <rect x="150" y="356" width="720" height="72" rx="10" fill="#f4f6fb" stroke="#c9d3e8" stroke-width="1.5"/>
  <circle cx="190" cy="392" r="17" fill="#5b6a88"/>
  <text x="190" y="398" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">3</text>
  <text x="226" y="386" font-size="19" font-weight="bold" fill="#1a2340">分科会</text>
  <text x="226" y="410" font-size="14" fill="#6b7a99">ブランチを切って実装（顧問AI）</text>
  <line x1="510" y1="428" x2="510" y2="450" stroke="#98a5bd" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4 審議 -->
  <rect x="150" y="450" width="720" height="72" rx="10" fill="#f4f6fb" stroke="#c9d3e8" stroke-width="1.5"/>
  <circle cx="190" cy="486" r="17" fill="#5b6a88"/>
  <text x="190" y="492" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">4</text>
  <text x="226" y="480" font-size="19" font-weight="bold" fill="#1a2340">審議</text>
  <text x="226" y="504" font-size="14" fill="#6b7a99">Pull Request（差分が審議資料）＋ CI が会計監査</text>
  <line x1="510" y1="522" x2="510" y2="544" stroke="#98a5bd" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="528" y="538" font-size="13" fill="#6b7a99">CI 緑</text>

  <!-- 5 試遊(人間) -->
  <rect x="150" y="544" width="720" height="72" rx="10" fill="#fff4ee" stroke="#e0603c" stroke-width="2.5"/>
  <circle cx="190" cy="580" r="17" fill="#e0603c"/>
  <text x="190" y="586" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">5</text>
  <text x="226" y="574" font-size="19" font-weight="bold" fill="#1a2340">試遊</text>
  <text x="226" y="598" font-size="14" fill="#8a6a5c">会長が実際に遊んで確かめる（マージ前の受け入れテスト）</text>
  <rect x="726" y="560" width="128" height="26" rx="13" fill="#e0603c"/>
  <text x="790" y="578" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">会長（人間）</text>
  <line x1="510" y1="616" x2="510" y2="638" stroke="#98a5bd" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="528" y="632" font-size="13" fill="#6b7a99">試遊OK</text>

  <!-- 差し戻しループ -->
  <path d="M 870 580 L 940 580 L 940 392 L 878 392" fill="none" stroke="#e0603c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowLoop)"/>
  <text x="954" y="480" font-size="13" fill="#e0603c">気になれば</text>
  <text x="954" y="498" font-size="13" fill="#e0603c">何度でも差し戻し</text>

  <!-- 6 決議 -->
  <rect x="150" y="638" width="720" height="72" rx="10" fill="#f4f6fb" stroke="#c9d3e8" stroke-width="1.5"/>
  <circle cx="190" cy="674" r="17" fill="#5b6a88"/>
  <text x="190" y="680" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">6</text>
  <text x="226" y="668" font-size="19" font-weight="bold" fill="#1a2340">決議</text>
  <text x="226" y="692" font-size="14" fill="#6b7a99">マージ（＝可決）</text>
  <line x1="510" y1="710" x2="510" y2="732" stroke="#98a5bd" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 7 記録 -->
  <rect x="150" y="732" width="720" height="72" rx="10" fill="#f4f6fb" stroke="#c9d3e8" stroke-width="1.5"/>
  <circle cx="190" cy="768" r="17" fill="#5b6a88"/>
  <text x="190" y="774" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">7</text>
  <text x="226" y="762" font-size="19" font-weight="bold" fill="#1a2340">記録</text>
  <text x="226" y="786" font-size="14" fill="#6b7a99">議事録を書く（却下案も残す）→ 完了条件を確認 → 本番スモーク</text>
  <line x1="510" y1="804" x2="510" y2="826" stroke="#98a5bd" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 達成済みへ -->
  <rect x="150" y="826" width="720" height="46" rx="8" fill="#eef1f7" stroke="#c9d3e8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="510" y="855" text-anchor="middle" font-size="16" fill="#5b6a88">議案書の「達成済み」へ移す（一覧が議事録への索引を兼ねる）</text>
</svg>
